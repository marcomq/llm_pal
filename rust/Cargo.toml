[workspace]
resolver = "2"
members = ["pal-core", "pal-brain", "pal-desktop", "pal-stt", "pal-godot", "pal-tts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pal-core = { path = "pal-core" }

# DSP and pitch tracking are slow unoptimized, also in tests.
[profile.dev]
opt-level = 2
