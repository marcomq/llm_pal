[package]
name = "pal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pal-core.workspace = true
pal-brain = { path = "../pal-brain" }
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
serde_json = "1"
mq-bridge = { version = "1.2.1", default-features = false, features = ["file"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
# Publish each segment as an mq-bridge message to an endpoint given as JSON.
bridge = ["dep:mq-bridge", "dep:tokio"]
