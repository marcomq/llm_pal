[package]
name = "pal-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
# ort has no stable 2.0; rc releases break the API, hence the exact pin.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
realfft = "3.5.1"
rtrb = "0.4.1"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
sonora = "0.2.0"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
# AAudio LowLatency performance mode; without it Android uses the slow mixer path with large bursts.
cpal = { version = "0.18.2", features = ["realtime"] }
# cpal needs the JavaVM and Context, see android.rs.
jni-sys = "0.4.1"
libc = "0.2"
ndk-context = "0.1.1"

[dev-dependencies]
hound = "3.5.1"
