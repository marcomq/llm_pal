[package]
name = "pal-brain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pal-core.workspace = true
llama-cpp-2 = "0.1.160"
thiserror = "2"
hound = "3.5.1"
pal-tts = { path = "../pal-tts" }
mq-bridge = { version = "1.3.0", default-features = false }
mq-bridge-onnx = { version = "0.2.0", default-features = false, features = ["asr"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Remote LLMs; rustls with built-in roots also works on Android, which has no TLS setup here.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# URLs are ASCII here (Hugging Face, local endpoints); 1.0.0 skips IDNA's ICU crates.
idna_adapter = "=1.0.0"

# Android has no TLS setup for the downloader; `push-models` copies the files there.
[target.'cfg(not(target_os = "android"))'.dependencies]
pal-tts = { path = "../pal-tts", features = ["download"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]

