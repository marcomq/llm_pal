[package]
name = "pal-brain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pal-core.workspace = true
libloading = "0.9"
llama-cpp-2 = "0.1.160"
thiserror = "2"
pal-tts = { path = "../pal-tts" }

# Android has no TLS setup for the downloader; `push-models` copies the files there.
[target.'cfg(not(target_os = "android"))'.dependencies]
pal-tts = { path = "../pal-tts", features = ["download"] }

[dev-dependencies]
hound = "3.5.1"

